{
name: "Daily Web3 Updates to Telegram",
on: {
schedule: [
{ cron: "0 3 * * *" },
{ cron: "0 13 * * *" }
],
workflow_dispatch: {
inputs: {
session: {
description: "Session label (e.g. Morning Brief / Evening Recap)",
required: false,
default: "Manual Run"
}
}
}
},
jobs: {
send-update: {
runs-on: "ubuntu-latest",
env: {
TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}",
TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}",
RUN_SESSION: "${{ inputs.session }}"
},
steps: [
{ uses: "actions/checkout@v6" },
{ uses: "actions/setup-node@v6" },
{ run: "node scripts/send_daily_update.js" }
]
}
}
}
